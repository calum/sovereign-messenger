[package]
name = "t0-arti"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "t0-arti"
path = "src/main.rs"

[dependencies]
# Pinned to the latest stable 0.x on crates.io at spike time (0.47.0).
# rustls instead of native-tls so the same feature set can target Android later.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-service", "onion-service-client"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
tor-cell = "=0.47.0"
tor-hsservice = "=0.47.0"
tor-proto = "=0.47.0"
safelog = "=0.10.0"
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tor-rtcompat = "=0.47.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
