[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
description = "Sovereign P2P messenger core: RAM-only state, PQ handshake, ratchet, signed updates"
license = "UNLICENSED"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"
ml-kem = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
getrandom = "0.3"

[profile.release]
panic = "abort"
debug = false
